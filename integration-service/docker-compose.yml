name: integration-service

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${INTEGRATION_DB_ROOT_PASSWORD:?copy env.example to .env}
      MYSQL_DATABASE: integration
      MYSQL_USER: integration
      MYSQL_PASSWORD: ${INTEGRATION_DB_PASSWORD:?copy env.example to .env}
    ports:
      # 3306 is DevLake's MySQL and 3307 is the throwaway e2e MySQL.
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?copy env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?copy env.example to .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  mysql-data:
  rabbitmq-data:
