name: integration-service
on:
  push:
    branches: [ main-arbisoft ]
    paths:
      - 'integration-service/**'
      - '.github/workflows/integration-service.yml'
  pull_request:
    branches: [ main, main-arbisoft ]
    paths:
      - 'integration-service/**'
      - '.github/workflows/integration-service.yml'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration-service
    steps:
    - uses: actions/checkout@v4
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: integration-service/global.json
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --configuration Release
